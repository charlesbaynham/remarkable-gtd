name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  scan-unit:
    # Fast job: CV/logic tests (incl. the real annotated-sheet fixture) — no Chromium.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test (render-independent)
        run: pytest -v --ignore=tests/test_end_to_end.py --ignore=tests/test_manifest.py

  full:
    # Full job: generator + manifest + end-to-end (renders with Chromium).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[dev]"
          playwright install --with-deps chromium
      - name: Test (all)
        run: pytest -v
